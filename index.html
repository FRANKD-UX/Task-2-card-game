<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frank Memory Card Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Frank Memory Card Game</h1>
    
    <div class="stats">
        <div class="stat">Moves: <span id="moves">0</span></div>
        <div class="stat">Pairs Found: <span id="pairs">0</span> of 8</div>
    </div>
    
    <div class="game-container" id="game-board"></div>
    
    <button id="restart-button">Restart Game</button>
    
    <div class="winner-message" id="winner-message">
        <h2>Congratulations!</h2>
        <p>You've found all the pairs in <span id="final-moves">0</span> moves!</p>
        <button id="play-again-button">Play Again</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
